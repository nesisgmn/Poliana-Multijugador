<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f1c0e">
<title>Poliana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --walnut:#2f1c0e; --mdf:#ecd3a0; --mdf-hi:#f7e8c8; --mdf-lo:#cfa86d; --line:#b58a4f; --ink:#3b2410; --cream:#f8ecd0;
  --purple:#6a3fa3; --purple-hi:#b79be0; --cell:22px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{
  background:repeating-linear-gradient(92deg,rgba(255,255,255,.03) 0 2px,transparent 2px 9px),radial-gradient(ellipse 90% 60% at 50% 0%,#5c3a21 0%,var(--walnut) 70%) fixed,var(--walnut);
  color:var(--cream); font-family:'Fredoka',system-ui,sans-serif; display:flex; justify-content:center;
}
main{width:100%; max-width:720px; padding:18px 10px 34px; display:flex; flex-direction:column; gap:14px}
header{display:flex; justify-content:space-between; align-items:center; gap:12px}
h1{margin:0; font-weight:700; font-size:2.6rem; letter-spacing:.05em; text-shadow:0 3px 0 #170c04}
h1 span:nth-child(4n+1){color:#4cc764} h1 span:nth-child(4n+2){color:#ffd23f} h1 span:nth-child(4n+3){color:#5b9bff} h1 span:nth-child(4n){color:#ff5a63}
#code{background:var(--mdf-hi); color:var(--ink); border:3px solid #8a5a2b; border-radius:999px; padding:4px 16px; font-weight:600; letter-spacing:.14em}
button,input{font:inherit; color:var(--ink)}
button{font-weight:600; cursor:pointer; background:linear-gradient(#fbe9bf,#e3bf80); border:2px solid #8a5a2b; border-bottom-width:4px; border-radius:14px; padding:9px 20px; min-height:46px; transition:transform .08s}
button:active:not(:disabled){transform:translateY(2px); border-bottom-width:2px}
button:focus-visible,input:focus-visible,.tk:focus-visible{outline:3px solid #fff; outline-offset:3px}
button:disabled{opacity:.4; cursor:not-allowed}
input{background:#fff8e6; border:2px solid #8a5a2b; border-radius:14px; padding:10px 14px; text-align:center; min-width:0; min-height:46px}
.main{background:linear-gradient(#ffd75e,#f0a81a); padding:10px 30px; font-size:1.1rem}
.on{background:linear-gradient(#b79be0,#6a3fa3); color:#fff; border-color:#3d1f6b}
.kill{border-color:#a3121b; box-shadow:0 0 0 2px #ff5a63}
.card{background:linear-gradient(#f6e4bb,#e8cd96); color:var(--ink); border:3px solid #8a5a2b; border-radius:22px; padding:22px 18px; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; box-shadow:0 10px 26px rgba(0,0,0,.45)}
.card small{color:#6d4b27; font-size:.9rem}
#err{color:#a3121b; min-height:1.2em; font-weight:500}
.row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
[hidden]{display:none!important}
#game{display:flex; flex-direction:column; gap:14px}

/* ---------- tablero ---------- */
#board{
  container-type:inline-size; width:100%; aspect-ratio:1; display:grid; grid-template-columns:repeat(15,1fr); grid-template-rows:repeat(15,1fr); gap:2px; padding:6px;
  background:repeating-linear-gradient(88deg,rgba(150,100,40,.14) 0 2px,transparent 2px 13px),linear-gradient(135deg,#f3dfb2,var(--mdf) 55%,#dfbf86);
  border:6px solid #8a5a2b; border-radius:22px; box-shadow:0 14px 34px rgba(0,0,0,.55), inset 0 0 0 2px #f9edcf;
}
@supports (width:1cqw){ #board{--cell:calc((100cqw - 28px) / 15)} }
.cell{position:relative; min-width:0; min-height:0; background:linear-gradient(#f9ecc9,#efd9a6); border:1px solid var(--line); border-radius:5px; box-shadow:inset 0 -2px 0 rgba(120,80,30,.18)}
.cell i{position:absolute; inset:0; display:grid; place-items:center; font-style:normal; font-weight:600; font-size:calc(var(--cell)*.5); color:var(--ink); line-height:1}
.cell.zone{border-color:#8f6cc0; box-shadow:inset 0 0 0 1px rgba(143,108,192,.55)}
.cell.col{background:linear-gradient(color-mix(in srgb,var(--c) 85%,#fff),var(--c)); border-color:#fff; box-shadow:0 1px 3px rgba(0,0,0,.35)}
.cell.col i{color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.55); font-weight:700}
.toks{position:absolute; inset:0; display:flex; align-items:center; justify-content:center}

.quad{position:relative; background:color-mix(in srgb,var(--c) 30%,#f2dfb4); border:2px solid color-mix(in srgb,var(--c) 65%,#fff); border-radius:12px; transition:box-shadow .3s,opacity .3s; min-width:0}
.quad.empty{opacity:.5}
.quad.act{box-shadow:0 0 0 3px #fff,0 0 20px 5px var(--c)}
.qname{position:absolute; max-width:64%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; font-size:calc(var(--cell)*.46); color:color-mix(in srgb,var(--c) 55%,#2a1608)}
.q0 .qname{left:6%; bottom:5%} .q1 .qname{left:6%; top:5%} .q2 .qname{right:6%; top:5%; text-align:right} .q3 .qname{right:6%; bottom:5%; text-align:right}
.step{position:relative; min-width:0; min-height:0; background:linear-gradient(color-mix(in srgb,var(--c) 80%,#fff),var(--c)); border:max(2px,calc(var(--cell)*.09)) solid #fff; border-radius:7px; box-shadow:0 2px 4px rgba(0,0,0,.4)}
.step i{position:absolute; inset:0; display:grid; place-items:center; font-style:normal; font-weight:700; font-size:calc(var(--cell)*.5); color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6); line-height:1}
.step.goal{box-shadow:0 0 0 2px #ffd23f,0 3px 6px rgba(0,0,0,.45)}

.arm{display:grid; gap:2px; min-width:0; min-height:0}
.arm.h{grid-template-columns:repeat(4,1fr); grid-template-rows:.5fr 2fr .5fr}
.arm.v{grid-template-columns:.5fr 2fr .5fr; grid-template-rows:repeat(4,1fr)}
.uc{display:grid; place-items:center; background:linear-gradient(#8a5bc4,var(--purple)); border:1px solid var(--purple-hi); border-radius:4px; color:#fff; font-weight:600; font-size:calc(var(--cell)*.32); line-height:1; overflow:hidden}
.base{display:grid; grid-template-columns:repeat(2,auto); grid-auto-rows:auto; place-content:center; gap:2px; background:radial-gradient(circle at 50% 35%,#b98650,#7d4d24); border-radius:12px; box-shadow:inset 0 3px 8px rgba(0,0,0,.55)}
.slot{position:relative; width:calc(var(--cell)*.98); height:calc(var(--cell)*.98); border-radius:50%; background:rgba(0,0,0,.28); box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}

#bowl{grid-column:6 / span 5; grid-row:6 / span 5; position:relative; display:grid; place-items:center; z-index:1;
  clip-path:polygon(29.3% 0,70.7% 0,100% 29.3%,100% 70.7%,70.7% 100%,29.3% 100%,0 70.7%,0 29.3%);
  background:repeating-linear-gradient(95deg,rgba(120,70,20,.2) 0 3px,transparent 3px 11px),radial-gradient(circle at 40% 30%,#f3d9a3,#d4a96a 68%,#b98445)}
.pit{width:80%; height:80%; display:flex; align-items:center; justify-content:center; gap:9%;
  clip-path:polygon(29.3% 0,70.7% 0,100% 29.3%,100% 70.7%,70.7% 100%,29.3% 100%,0 70.7%,0 29.3%);
  background:radial-gradient(circle at 50% 30%,#74492a 0%,#3b2210 52%,#140a03 100%)}
.die{width:33%; aspect-ratio:1; border-radius:20%; background:linear-gradient(145deg,#fffdf6,#e8dfc8); box-shadow:0 3px 0 #b3a78c,0 8px 12px rgba(0,0,0,.65); display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); padding:13%; gap:3%}
.die span{border-radius:50%}
.die .pip{background:#2b1a0d; box-shadow:inset 0 1px 1px #000}
.die.used{opacity:.4}
.die.roll{animation:shake .5s}
@keyframes shake{20%{transform:rotate(-24deg) scale(1.08)}50%{transform:rotate(20deg) scale(1.08)}80%{transform:rotate(-8deg)}}

/* ---------- fichas ---------- */
.tk{
  position:relative; flex:none; width:calc(var(--cell)*.94); height:calc(var(--cell)*.94); border-radius:50%; display:grid; place-items:center; pointer-events:none;
  font-weight:700; font-size:calc(var(--cell)*.52); line-height:1; color:var(--fg,#fff); text-shadow:0 1px 1px rgba(0,0,0,.45);
  background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--tc) 55%,#fff) 0%,var(--tc) 46%,color-mix(in srgb,var(--tc) 72%,#000) 100%);
  border:max(2px,calc(var(--cell)*.08)) solid #fff;
  box-shadow:0 calc(var(--cell)*.09) 0 rgba(0,0,0,.4),0 calc(var(--cell)*.15) calc(var(--cell)*.15) rgba(0,0,0,.4),inset 0 -3px 4px rgba(0,0,0,.25);
}
.tk+.tk{margin-left:calc(var(--cell)*-.5); translate:0 calc(var(--cell)*-.1)}
.tk+.tk+.tk{translate:0 calc(var(--cell)*-.2)}
.tk+.tk+.tk+.tk{translate:0 calc(var(--cell)*-.3)}
.tk.done{filter:saturate(.8)}
.tk.can{pointer-events:auto; cursor:pointer; scale:1.22; z-index:6; --halo:#fff; animation:halo 1s ease-in-out infinite}
.tk.can.hit{--halo:#ff3b3b}
.tk.can::after{content:''; position:absolute; inset:-10px; border-radius:50%}
@keyframes halo{
  0%,100%{box-shadow:0 0 0 3px var(--halo),0 0 0 5px var(--tc),0 0 14px 6px color-mix(in srgb,var(--halo) 80%,transparent)}
  50%{box-shadow:0 0 0 3px var(--halo),0 0 0 8px var(--tc),0 0 24px 12px color-mix(in srgb,var(--halo) 50%,transparent)}
}

/* ---------- mensajes y controles ---------- */
#msg{text-align:center; min-height:2.6em; font-size:1.2rem; font-weight:500; text-wrap:balance}
#hint{text-align:center; color:#e7cf9d; font-size:.95rem; min-height:1.3em; text-wrap:balance}
#chips button{min-width:112px}
#roll.idle{filter:grayscale(.55); opacity:.75}
#players{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
#lplayers{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.pl{display:flex; align-items:center; gap:8px; background:rgba(255,248,230,.1); border:2px solid rgba(255,235,190,.25); border-radius:999px; padding:5px 14px; font-size:.9rem; color:#dcc79c}
.card .pl{background:rgba(59,36,16,.08); border-color:rgba(59,36,16,.25); color:var(--ink)}
.pl.cur{border-color:#ffd23f; color:var(--cream); background:rgba(255,210,63,.15)}
.pl .tk{width:16px; height:16px; border-width:2px; box-shadow:none; font-size:0}
.pl.skip{border-style:dashed}

#toast{position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px); left:50%; translate:-50% 0; width:max-content; max-width:min(92vw,520px); z-index:30; background:#7a1219; color:#fff; border:3px solid #fff; border-radius:16px; padding:10px 18px; font-weight:600; text-align:center; box-shadow:0 10px 26px rgba(0,0,0,.55)}
#over{position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:16px; background:rgba(20,10,4,.74); backdrop-filter:blur(3px)}
#over .card{width:min(92vw,400px); padding:28px 22px}
#over h2{margin:0; font-size:1.7rem; font-weight:700}
#over .big{width:64px; height:64px; font-size:2rem; --cell:68px}
#over .row{flex-direction:column; width:100%}
#over button{width:100%}

@media (max-width:520px){ h1{font-size:2.1rem} main{padding:12px 6px 28px} #board{padding:4px; border-width:4px} #chips button{min-width:96px} }
@media (prefers-reduced-motion:reduce){ .tk.can,.die.roll{animation:none} *{transition:none!important} }
</style>
</head>
<body>
<main>
  <header><h1 aria-label="Poliana"><span>P</span><span>o</span><span>l</span><span>i</span><span>a</span><span>n</span><span>a</span></h1><div id="code" hidden></div></header>

  <section id="home" class="card">
    <input id="name" maxlength="14" placeholder="Tu nombre" autocomplete="off">
    <button class="main" id="create">Crear sala</button>
    <small>o entra con el código de un amigo</small>
    <div class="row"><input id="jcode" maxlength="4" placeholder="Código" autocomplete="off" style="width:110px;text-transform:uppercase"><button id="join">Unirme</button></div>
    <div id="err"></div>
  </section>

  <section id="lobby" class="card" hidden>
    <small>Pásale este link a tus amigos (2 a 4 jugadores)</small>
    <button id="copy">Copiar link</button>
    <div id="lplayers"></div>
    <button class="main" id="start">Empezar partida</button>
    <small id="wait"></small>
  </section>

  <section id="game" hidden>
    <div id="board" role="group" aria-label="Tablero de Poliana"></div>
    <div id="msg" aria-live="polite"></div>
    <div class="row" id="chips"></div>
    <div id="hint"></div>
    <div class="row"><button class="main" id="roll">Tirar dados</button></div>
    <div id="players"></div>
  </section>
</main>

<div id="toast" role="alert" hidden></div>

<div id="over" role="dialog" aria-modal="true" aria-labelledby="overTitle" hidden>
  <div class="card">
    <b class="tk big" id="overTk">★</b>
    <h2 id="overTitle"></h2>
    <small id="overSub">Liberó sus 4 fichas</small>
    <div class="row">
      <button class="main" id="again">Jugar otra partida</button>
      <button id="menu">Salir al menú principal</button>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const COL = [['Verde','#1f9d3a','#fff'],['Amarillo','#f2b705','#3b2800'],['Azul','#1f67dd','#fff'],['Rojo','#d6212c','#fff']];
  const END = 57;
  const xy = i => { const s = Math.floor(i / 14), k = i % 14; return s === 0 ? [0,k] : s === 1 ? [k,14] : s === 2 ? [14,14-k] : [14-k,0]; };
  const label = k => k === 0 ? 9 : k <= 5 ? k + 9 : k - 5;
  const mk = (cls, html) => { const d = document.createElement('div'); d.className = cls; if (html) d.innerHTML = html; return d; };

  // ---------- tablero ----------
  const board = $('board');
  for (let i = 0; i < 56; i++) {
    const [x, y] = xy(i), k = i % 14, s = Math.floor(i / 14);
    const d = mk('cell' + (k === 0 || k === 8 ? ' col' : '') + (k >= 6 ? ' zone' : ''), '<i>' + label(k) + '</i><div class="toks"></div>');
    d.id = 'r' + i; d.style.gridColumn = x + 1; d.style.gridRow = y + 1; d.style.setProperty('--c', COL[s][1]); board.appendChild(d);
  }
  // cuadrantes con la escalera de llegada (casas 1 a 7)
  const PATH = [[0,0],[1,0],[1,1],[2,1],[2,2],[3,2],[3,3]];
  for (let ci = 0; ci < 4; ci++) {
    const gx0 = ci < 2 ? 1 : 9, gy0 = (ci === 0 || ci === 3) ? 1 : 9;
    const q = mk('quad q' + ci, '<span class="qname" id="qn' + ci + '">' + COL[ci][0] + '</span>'); q.id = 'q' + ci;
    q.style.gridColumn = (gx0 + 1) + ' / span 5'; q.style.gridRow = (gy0 + 1) + ' / span 5'; q.style.setProperty('--c', COL[ci][1]); board.appendChild(q);
    PATH.forEach(([x, y], n) => {
      const gx = ci < 2 ? 1 + x : 13 - x, gy = (ci === 0 || ci === 3) ? 1 + y : 13 - y;
      const h = mk('step cell-h' + (n === 6 ? ' goal' : ''), '<i>' + (n + 1) + '</i><div class="toks"></div>');
      h.id = 'h' + ci + '_' + (n + 1); h.style.gridColumn = gx + 1; h.style.gridRow = gy + 1; h.style.setProperty('--c', COL[ci][1]); board.appendChild(h);
    });
  }
  // bloque morado en U (1 al 8) con la celda de las 4 fichas
  const AP = (s, d, a) => s === 0 ? [d, a + 1] : s === 1 ? [a + 1, 5 - d] : s === 2 ? [5 - d, 3 - a] : [3 - a, d];
  const ARM = [['2 / span 4','7 / span 3'],['7 / span 3','11 / span 4'],['11 / span 4','7 / span 3'],['7 / span 3','2 / span 4']];
  const BASE = [['1 / span 3','2'],['2','2 / span 3'],['2 / span 3','2'],['2','1 / span 3']];
  for (let s = 0; s < 4; s++) {
    const arm = mk('arm ' + (s % 2 === 0 ? 'h' : 'v')); arm.style.gridColumn = ARM[s][0]; arm.style.gridRow = ARM[s][1]; board.appendChild(arm);
    const put = (d, a, txt) => { const [c, r] = AP(s, d, a), u = mk('uc', txt || ''); u.style.gridColumn = c; u.style.gridRow = r; arm.appendChild(u); };
    for (let d = 1; d <= 4; d++) put(d, 0, d);
    for (let d = 4; d >= 1; d--) put(d, 2, 9 - d);
    put(4, 1, '');
    const base = mk('base'); base.style.gridColumn = BASE[s][0]; base.style.gridRow = BASE[s][1];
    for (let i = 0; i < 4; i++) { const sl = mk('slot', '<div class="toks"></div>'); sl.id = 's' + s + '_' + i; base.appendChild(sl); }
    arm.appendChild(base);
  }
  const bowl = mk('', '<div class="pit"><div class="die" id="d0"></div><div class="die" id="d1"></div></div>'); bowl.id = 'bowl'; board.appendChild(bowl);

  const ringIdx = (ci, st) => (ci * 14 + 6 + st) % 56;
  const where = (ci, st, i) => st < 0 ? $('s' + ci + '_' + i) : st <= 50 ? $('r' + ringIdx(ci, st)) : $('h' + ci + '_' + (st - 50));
  const token = (ci, i) => { const t = document.createElement('b'); t.className = 'tk'; t.textContent = i + 1; t.style.setProperty('--tc', COL[ci][1]); t.style.setProperty('--fg', COL[ci][2]); return t; };
  const dot = ci => { const t = document.createElement('b'); t.className = 'tk'; t.style.setProperty('--tc', COL[ci][1]); return t; };
  const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  const face = (el, v) => { el.innerHTML = v ? Array.from({length:9}, (_, k) => '<span' + (PIPS[v].includes(k) ? ' class="pip"' : '') + '></span>').join('') : ''; el.setAttribute('aria-label', v ? 'Dado: ' + v : 'Dado sin tirar'); };

  // ---------- conexión ----------
  let ws, S = null, sess = null, selKey = null, lastN = null, toastT = null, overShown = false;
  try { sess = JSON.parse(sessionStorage.getItem('poliana') || 'null'); } catch (e) {}
  const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  function connect(first){
    const sock = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host); ws = sock;
    sock.onopen = () => { if (first) first(); else if (sess) send({t:'join', code:sess.code, id:sess.id, name:sess.name}); };
    sock.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.t === 'error') { $('err').textContent = m.text; if (sess) { sess = null; try { sessionStorage.removeItem('poliana'); } catch (x) {} S = null; show(); } }
      else if (m.t === 'state') onState(m);
    };
    sock.onclose = () => { if (sess && ws === sock) setTimeout(() => connect(), 1500); };
  }
  const open = cb => (ws && ws.readyState === 1) ? cb() : connect(cb);
  const nm = () => $('name').value.trim() || 'Jugador';

  $('create').onclick = () => { $('err').textContent = ''; open(() => send({t:'create', name:nm()})); };
  $('join').onclick = () => {
    const c = $('jcode').value.trim(); if (!c) { $('err').textContent = 'Escribe el código de la sala'; return; }
    $('err').textContent = ''; open(() => send({t:'join', code:c, name:nm()}));
  };
  $('start').onclick = () => send({t:'start'});
  $('again').onclick = () => send({t:'start'});
  $('roll').onclick = () => send({t:'roll'});            // se permite aunque no sea tu turno: el servidor castiga
  $('menu').onclick = () => {
    try { sessionStorage.removeItem('poliana'); } catch (e) {}
    const old = ws; sess = null; S = null; selKey = null; lastN = null; overShown = false; ws = null;
    if (old) { try { old.close(); } catch (e) {} }
    $('err').textContent = ''; $('copy').textContent = 'Copiar link'; show();
  };
  $('copy').onclick = async () => {
    const link = location.origin + location.pathname + '?sala=' + S.code;
    try { await navigator.clipboard.writeText(link); $('copy').textContent = 'Link copiado'; } catch (e) { $('copy').textContent = link; }
  };
  const q = new URLSearchParams(location.search).get('sala'); if (q) $('jcode').value = q.toUpperCase();

  function toast(text){
    const t = $('toast'); t.textContent = text; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 5200);
  }

  // ---------- estado ----------
  function onState(m){
    const prev = S; S = m;
    if (!sess || sess.code !== m.code || sess.id !== m.id) {
      sess = {code:m.code, id:m.id, name:m.players[m.you].name};
      try { sessionStorage.setItem('poliana', JSON.stringify(sess)); } catch (e) {}
    }
    if (m.notice) {
      if (lastN === null) lastN = m.notice.n;
      else if (m.notice.n !== lastN) { lastN = m.notice.n; if (m.notice.text) toast(m.notice.text); }
    }
    if (m.cur === m.you && m.phase === 'move') {
      const av = m.legal.amts.filter(a => a.pieces.length);
      if (!av.some(a => a.key === selKey)) selKey = (av.length === 1 && m.legal.enter < 0) ? av[0].key : null;
    } else selKey = null;
    show(); render();
    if (m.dice[0] && (!prev || prev.phase === 'roll' || prev.dice.join() !== m.dice.join())) ['d0','d1'].forEach(id => { const d = $(id); d.classList.remove('roll'); void d.offsetWidth; d.classList.add('roll'); });
  }
  function show(){
    const lobby = S && S.phase === 'lobby', game = S && !lobby;
    $('home').hidden = !!S; $('lobby').hidden = !lobby; $('game').hidden = !game;
    $('code').hidden = !S; if (S) $('code').textContent = 'Sala ' + S.code;
    const over = !!S && S.phase === 'over';
    $('over').hidden = !over;
    if (over && !overShown) { overShown = true; setTimeout(() => $('again').focus(), 50); }
    if (!over) overShown = false;
    if (!S) { $('toast').hidden = true; $('copy').textContent = 'Copiar link'; }
  }
  function can(i){
    const s = S; if (s.cur !== s.you || s.phase !== 'move') return false;
    const st = s.players[s.you].steps[i];
    if (st < 0) return s.legal.enter >= 0;
    if (st >= END || !selKey) return false;
    const a = s.legal.amts.find(x => x.key === selKey); return !!a && a.pieces.includes(i);
  }
  function pick(i){ const st = S.players[S.you].steps[i]; send({t:'move', i, key: st < 0 ? 'e' : selKey}); }
  function hintText(s, mine){
    if (!mine) return '';
    if (s.phase === 'roll') return 'Tu turno: toca “Tirar dados”';
    if (s.phase !== 'move') return '';
    const L = s.legal, canMove = L.amts.some(a => a.pieces.length);
    if (L.bonus) return 'Bono de +' + L.bonus + ': toca la ficha que quieres avanzar ' + L.bonus + ' casillas';
    if (L.kill) return '¡Puedes matar! Elige el dado marcado y toca la ficha que mata. Si no matas, te soplan';
    if (L.enter >= 0 && !canMove) return 'Toca una ficha de tu celda para sembrarla';
    return 'Elige un dado y toca la ficha que quieres mover';
  }

  function render(){
    const s = S, mine = s.cur === s.you;
    if (s.phase === 'lobby') {
      $('lplayers').innerHTML = '';
      s.players.forEach((p, k) => { const d = mk('pl'); d.appendChild(dot(k)); d.append(p.name + (k === s.you ? ' (tú)' : '')); $('lplayers').appendChild(d); });
      const host = s.you === 0;
      $('start').hidden = !host; $('start').disabled = s.players.length < 2;
      $('wait').textContent = host ? (s.players.length < 2 ? 'Esperando a que se una al menos un amigo' : 'Cuando estén todos, dale a empezar') : 'Esperando a que el anfitrión empiece';
      return;
    }
    document.querySelectorAll('.toks').forEach(e => e.innerHTML = '');
    const sel = (mine && s.phase === 'move' && selKey) ? s.legal.amts.find(a => a.key === selKey) : null;
    s.players.forEach((p, pi) => p.steps.forEach((st, i) => {
      const t = token(p.ci, i); if (st === END) t.classList.add('done');
      if (pi === s.you && can(i)) {
        t.classList.add('can'); if (sel && sel.kills.includes(i)) t.classList.add('hit');
        t.tabIndex = 0; t.setAttribute('role', 'button'); t.setAttribute('aria-label', 'Mover ficha ' + (i + 1));
        t.onclick = () => pick(i);
        t.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(i); } };
      }
      where(p.ci, st, i).querySelector('.toks').appendChild(t);
    }));
    const byCi = {}; s.players.forEach(p => { byCi[p.ci] = p; });
    for (let ci = 0; ci < 4; ci++) {
      $('q' + ci).classList.toggle('empty', !byCi[ci]);
      $('q' + ci).classList.toggle('act', !!byCi[ci] && s.phase !== 'over' && s.players[s.cur].ci === ci);
      $('qn' + ci).textContent = byCi[ci] ? byCi[ci].name : COL[ci][0];
    }
    $('players').innerHTML = '';
    s.players.forEach((p, pi) => {
      const d = mk('pl' + (pi === s.cur && s.phase !== 'over' ? ' cur' : '') + (p.skip ? ' skip' : ''));
      d.appendChild(dot(p.ci));
      d.append(p.name + (pi === s.you ? ' (tú)' : '') + ' · ' + p.steps.filter(x => x === END).length + '/4 libres' + (p.on ? '' : ' · desconectado') + (p.skip ? ' · pierde su próximo turno' : ''));
      $('players').appendChild(d);
    });
    face($('d0'), s.dice[0]); face($('d1'), s.dice[1]);
    $('d0').classList.toggle('used', s.used[0]); $('d1').classList.toggle('used', s.used[1]);
    $('msg').textContent = s.msg;
    $('hint').textContent = hintText(s, mine);
    $('roll').hidden = s.phase === 'over'; $('roll').classList.toggle('idle', !(mine && s.phase === 'roll'));

    const chips = $('chips'); chips.innerHTML = '';
    if (mine && s.phase === 'move') {
      s.legal.amts.forEach(a => {
        const b = document.createElement('button');
        b.textContent = (a.bonus ? 'Bono +' + a.val : a.sum ? 'Suma ' + a.val : 'Dado ' + a.val) + (a.kills.length ? ' · mata' : '');
        b.disabled = !a.pieces.length; if (a.key === selKey) b.classList.add('on'); if (a.kills.length) b.classList.add('kill');
        b.onclick = () => { selKey = a.key; render(); }; chips.appendChild(b);
      });
    }
    if (s.phase === 'over') {
      const w = s.players.find(p => p.steps.every(x => x === END)) || s.players[s.cur];
      $('overTitle').textContent = '¡' + w.name + ' ganó!';
      const t = $('overTk'); t.style.setProperty('--tc', COL[w.ci][1]); t.style.setProperty('--fg', COL[w.ci][2]);
      $('overSub').textContent = 'Liberó sus 4 fichas con el color ' + COL[w.ci][0].toLowerCase();
    }
  }

  show();
  if (sess) connect();
})();
</script>
</body>
</html>
