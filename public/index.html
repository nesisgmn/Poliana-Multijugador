<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f1c0e">
<title>Poliana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --walnut:#2f1c0e; --mdf:#ecd3a0; --mdf-hi:#f7e8c8; --mdf-lo:#cfa86d; --line:#b58a4f; --ink:#3b2410; --cream:#f8ecd0;
  --purple:#6a3fa3; --purple-hi:#b79be0; --cell:22px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{
  background:repeating-linear-gradient(92deg,rgba(255,255,255,.03) 0 2px,transparent 2px 9px),radial-gradient(ellipse 90% 60% at 50% 0%,#5c3a21 0%,var(--walnut) 70%) fixed,var(--walnut);
  color:var(--cream); font-family:'Fredoka',system-ui,sans-serif; display:flex; justify-content:center;
}
main{width:100%; max-width:720px; padding:18px 10px 34px; display:flex; flex-direction:column; gap:14px}
header{display:flex; justify-content:space-between; align-items:center; gap:12px}
h1{margin:0; font-weight:700; font-size:2.6rem; letter-spacing:.05em; text-shadow:0 3px 0 #170c04}
h1 span:nth-child(4n+1){color:#4cc764} h1 span:nth-child(4n+2){color:#ffd23f} h1 span:nth-child(4n+3){color:#5b9bff} h1 span:nth-child(4n){color:#ff5a63}
#code{background:var(--mdf-hi); color:var(--ink); border:3px solid #8a5a2b; border-radius:999px; padding:4px 16px; font-weight:600; letter-spacing:.14em}
button,input{font:inherit; color:var(--ink)}
button{font-weight:600; cursor:pointer; background:linear-gradient(#fbe9bf,#e3bf80); border:2px solid #8a5a2b; border-bottom-width:4px; border-radius:14px; padding:9px 20px; min-height:46px; transition:transform .08s}
button:active:not(:disabled){transform:translateY(2px); border-bottom-width:2px}
button:focus-visible,input:focus-visible,.tk:focus-visible{outline:3px solid #fff; outline-offset:3px}
button:disabled{opacity:.4; cursor:not-allowed}
input{background:#fff8e6; border:2px solid #8a5a2b; border-radius:14px; padding:10px 14px; text-align:center; min-width:0; min-height:46px}
.main{background:linear-gradient(#ffd75e,#f0a81a); padding:10px 30px; font-size:1.1rem}
.on{background:linear-gradient(#b79be0,#6a3fa3); color:#fff; border-color:#3d1f6b}
.kill{border-color:#a3121b; box-shadow:0 0 0 2px #ff5a63}
.card{background:linear-gradient(#f6e4bb,#e8cd96); color:var(--ink); border:3px solid #8a5a2b; border-radius:22px; padding:22px 18px; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; box-shadow:0 10px 26px rgba(0,0,0,.45)}
.card small{color:#6d4b27; font-size:.9rem}
#err{color:#a3121b; min-height:1.2em; font-weight:500}
.row{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
[hidden]{display:none!important}
#game{display:flex; flex-direction:column; gap:14px}

/* ---------- tablero ---------- */
#bw{display:flex; flex-direction:column; gap:8px; width:100%}
#board{
  container-type:inline-size; width:100%; aspect-ratio:1; display:grid; grid-template-columns:repeat(15,1fr); grid-template-rows:repeat(15,1fr); gap:2px; padding:6px;
  background:repeating-linear-gradient(88deg,rgba(150,100,40,.14) 0 2px,transparent 2px 13px),linear-gradient(135deg,#f3dfb2,var(--mdf) 55%,#dfbf86);
  border:6px solid #8a5a2b; border-radius:22px; box-shadow:0 14px 34px rgba(0,0,0,.55), inset 0 0 0 2px #f9edcf;
}
@supports (width:1cqw){ #board{--cell:calc((100cqw - 28px) / 15)} }
.cell{position:relative; min-width:0; min-height:0; background:linear-gradient(#f9ecc9,#efd9a6); border:1px solid var(--line); border-radius:5px; box-shadow:inset 0 -2px 0 rgba(120,80,30,.18)}
.cell i{position:absolute; inset:0; display:grid; place-items:center; font-style:normal; font-weight:600; font-size:calc(var(--cell)*.5); color:var(--ink); line-height:1}
.cell.zone{border-color:#8f6cc0; box-shadow:inset 0 0 0 1px rgba(143,108,192,.55)}
.cell.col{background:linear-gradient(color-mix(in srgb,var(--c) 85%,#fff),var(--c)); border-color:#fff; box-shadow:0 1px 3px rgba(0,0,0,.35)}
.cell.col i{color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.55); font-weight:700}
.toks{position:absolute; inset:0; display:flex; align-items:center; justify-content:center}

.quad{position:relative; background:color-mix(in srgb,var(--c) 30%,#f2dfb4); border:2px solid color-mix(in srgb,var(--c) 65%,#fff); border-radius:12px; transition:box-shadow .3s,opacity .3s; min-width:0}
.quad.empty{opacity:.5}
.quad.act{box-shadow:0 0 0 3px #fff,0 0 20px 5px var(--c)}
.qname{position:absolute; max-width:64%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; font-size:calc(var(--cell)*.46); color:color-mix(in srgb,var(--c) 55%,#2a1608)}
.q0 .qname{left:6%; bottom:5%} .q1 .qname{left:6%; top:5%} .q2 .qname{right:6%; top:5%; text-align:right} .q3 .qname{right:6%; bottom:5%; text-align:right}
.step{position:relative; min-width:0; min-height:0; background:linear-gradient(color-mix(in srgb,var(--c) 80%,#fff),var(--c)); border:max(2px,calc(var(--cell)*.09)) solid #fff; border-radius:7px; box-shadow:0 2px 4px rgba(0,0,0,.4)}
.step i{position:absolute; inset:0; display:grid; place-items:center; font-style:normal; font-weight:700; font-size:calc(var(--cell)*.5); color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6); line-height:1}
.step.goal{box-shadow:0 0 0 2px #ffd23f,0 3px 6px rgba(0,0,0,.45)}

.arm{display:grid; gap:2px; min-width:0; min-height:0}
.arm.h{grid-template-columns:repeat(4,1fr); grid-template-rows:.5fr 2fr .5fr}
.arm.v{grid-template-columns:.5fr 2fr .5fr; grid-template-rows:repeat(4,1fr)}
.uc{position:relative; display:grid; place-items:center; background:linear-gradient(#8a5bc4,var(--purple)); border:1px solid var(--purple-hi); border-radius:4px; color:#fff; font-weight:600; font-size:calc(var(--cell)*.32); line-height:1}
.uc .tk{scale:.58}
.uc .tk.can{scale:.85}
.uc .tk.can.pick{scale:1}
.base{display:grid; grid-template-columns:repeat(2,auto); grid-auto-rows:auto; place-content:center; gap:2px; background:radial-gradient(circle at 50% 35%,#b98650,#7d4d24); border-radius:12px; box-shadow:inset 0 3px 8px rgba(0,0,0,.55)}
.slot{position:relative; width:calc(var(--cell)*.9); height:calc(var(--cell)*.9); border-radius:50%; background:rgba(0,0,0,.28); box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.seed{position:relative; place-self:center; width:calc(var(--cell)*.96); height:calc(var(--cell)*.96); border-radius:8px;
  background:linear-gradient(color-mix(in srgb,var(--c) 75%,#fff),var(--c)); border:max(2px,calc(var(--cell)*.09)) solid #fff;
  box-shadow:0 2px 5px rgba(0,0,0,.5),inset 0 0 0 calc(var(--cell)*.09) rgba(0,0,0,.16)}

#bowl{grid-column:6 / span 5; grid-row:6 / span 5; position:relative; display:grid; place-items:center; z-index:1;
  clip-path:polygon(29.3% 0,70.7% 0,100% 29.3%,100% 70.7%,70.7% 100%,29.3% 100%,0 70.7%,0 29.3%);
  background:repeating-linear-gradient(95deg,rgba(120,70,20,.2) 0 3px,transparent 3px 11px),radial-gradient(circle at 40% 30%,#f3d9a3,#d4a96a 68%,#b98445)}
.pit{width:80%; height:80%; display:flex; align-items:center; justify-content:center; gap:9%; perspective:420px;
  clip-path:polygon(29.3% 0,70.7% 0,100% 29.3%,100% 70.7%,70.7% 100%,29.3% 100%,0 70.7%,0 29.3%);
  background:radial-gradient(circle at 50% 30%,#74492a 0%,#3b2210 52%,#140a03 100%)}
.die{width:33%; aspect-ratio:1; border-radius:20%; background:linear-gradient(145deg,#fffdf6,#e8dfc8); box-shadow:0 3px 0 #b3a78c,0 8px 12px rgba(0,0,0,.65); display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); padding:13%; gap:3%; transform-style:preserve-3d}
.die span{border-radius:50%}
.die .pip{background:#2b1a0d; box-shadow:inset 0 1px 1px #000}
.die.used{opacity:.4}
.die.tumble{animation:tumble .64s cubic-bezier(.3,.7,.4,1) both}
@keyframes tumble{
  0%{transform:translateY(0) rotateX(0) rotateY(0) rotateZ(0) scale(1)}
  22%{transform:translateY(-40%) rotateX(200deg) rotateY(90deg) rotateZ(40deg) scale(1.22)}
  45%{transform:translateY(0) rotateX(400deg) rotateY(220deg) rotateZ(-30deg) scale(1)}
  62%{transform:translateY(-18%) rotateX(520deg) rotateY(300deg) rotateZ(18deg) scale(1.1)}
  80%{transform:translateY(0) rotateX(680deg) rotateY(340deg) rotateZ(-8deg) scale(1)}
  90%{transform:translateY(-6%) rotateX(716deg) rotateY(358deg) scale(1.03)}
  100%{transform:translateY(0) rotateX(720deg) rotateY(360deg) rotateZ(0) scale(1)}
}

.trays{display:flex; justify-content:space-between; gap:8px}
.tray{--cell:26px; display:flex; align-items:center; gap:6px; padding:4px 10px; min-height:38px; border-radius:999px; background:color-mix(in srgb,var(--c) 26%,#2f1c0e); border:2px solid color-mix(in srgb,var(--c) 70%,#fff); transition:opacity .3s}
.tray.empty{opacity:.3}
.tn{font-size:.74rem; font-weight:600; max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#f3e2bd}
.tslot{width:calc(var(--cell)*1.05); height:calc(var(--cell)*1.05); border-radius:50%; background:rgba(0,0,0,.35); box-shadow:inset 0 2px 3px rgba(0,0,0,.6); display:grid; place-items:center}

.tk{
  position:relative; flex:none; width:calc(var(--cell)*.94); height:calc(var(--cell)*.94); border-radius:50%; display:grid; place-items:center; pointer-events:none;
  font-weight:700; font-size:calc(var(--cell)*.52); line-height:1; color:var(--fg,#fff); text-shadow:0 1px 1px rgba(0,0,0,.45);
  background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--tc) 55%,#fff) 0%,var(--tc) 46%,color-mix(in srgb,var(--tc) 72%,#000) 100%);
  border:max(2px,calc(var(--cell)*.08)) solid #fff;
  box-shadow:0 calc(var(--cell)*.09) 0 rgba(0,0,0,.4),0 calc(var(--cell)*.15) calc(var(--cell)*.15) rgba(0,0,0,.4),inset 0 -3px 4px rgba(0,0,0,.25);
}
.tk+.tk{margin-left:calc(var(--cell)*-.5); translate:0 calc(var(--cell)*-.1)}
.tk+.tk+.tk{translate:0 calc(var(--cell)*-.2)}
.tk+.tk+.tk+.tk{translate:0 calc(var(--cell)*-.3)}
.tk.done{filter:saturate(.8)}
.tk.can{pointer-events:auto; cursor:pointer; scale:1.22; z-index:6; --halo:#fff; animation:halo 1s ease-in-out infinite}
.tk.can.pick{scale:1.45}
.tk.can.hit{--halo:#ff3b3b}
.tk.can::after{content:''; position:absolute; inset:-10px; border-radius:50%}
@keyframes halo{
  0%,100%{box-shadow:0 0 0 3px var(--halo),0 0 0 5px var(--tc),0 0 14px 6px color-mix(in srgb,var(--halo) 80%,transparent)}
  50%{box-shadow:0 0 0 3px var(--halo),0 0 0 8px var(--tc),0 0 24px 12px color-mix(in srgb,var(--halo) 50%,transparent)}
}

#clock{align-self:center; background:rgba(0,0,0,.35); border:2px solid rgba(255,235,190,.35); border-radius:999px; padding:2px 16px; font-weight:600; font-size:1.05rem; letter-spacing:.06em; font-variant-numeric:tabular-nums}
#clock.low{background:#7a1219; border-color:#fff; color:#fff; animation:blink 1s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.55}}
#msg{text-align:center; min-height:2.6em; font-size:1.2rem; font-weight:500; text-wrap:balance}
#hint{text-align:center; color:#e7cf9d; font-size:.95rem; min-height:1.3em; text-wrap:balance}
#chips button{min-width:112px}
#roll.idle{filter:grayscale(.55); opacity:.75}
#players{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
#lplayers{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.pl{display:flex; align-items:center; gap:8px; background:rgba(255,248,230,.1); border:2px solid rgba(255,235,190,.25); border-radius:999px; padding:5px 14px; font-size:.9rem; color:#dcc79c}
.card .pl{background:rgba(59,36,16,.08); border-color:rgba(59,36,16,.25); color:var(--ink)}
.pl.cur{border-color:#ffd23f; color:var(--cream); background:rgba(255,210,63,.15)}
.pl .tk{width:16px; height:16px; border-width:2px; box-shadow:none; font-size:0; flex:none}
.pl.spec{border-style:dashed}

.spec{gap:10px; padding:16px 14px}
.spec button{padding:6px 12px; min-height:42px}
#emo button{font-size:1.5rem; padding:4px 12px}
#quick button{font-size:.9rem; padding:5px 12px; min-height:38px}
#sayf input{width:min(100%,260px)}
#fx{position:fixed; inset:0; z-index:35; pointer-events:none; overflow:hidden}
.fl{position:absolute; bottom:10%; translate:-50% 0; display:flex; flex-direction:column; align-items:center; animation:rise 2.8s ease-out forwards}
.fl .fe{font-size:2.8rem; filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.fl .fn{background:rgba(0,0,0,.6); color:#fff; border-radius:999px; padding:1px 9px; font-size:.72rem}
@keyframes rise{
  0%{transform:translateY(0) scale(.6); opacity:0}
  12%{opacity:1; transform:translateY(-30px) scale(1.2)}
  100%{transform:translateY(-62vh) scale(1) rotate(8deg); opacity:0}
}
#fxb{position:fixed; top:calc(env(safe-area-inset-top,0px) + 64px); left:50%; translate:-50% 0; z-index:36; pointer-events:none; display:flex; flex-direction:column; gap:6px; align-items:center; width:max-content; max-width:92vw}
.fb{background:linear-gradient(#b79be0,#6a3fa3); color:#fff; border:3px solid #fff; border-radius:16px; padding:8px 16px; font-weight:600; text-align:center; box-shadow:0 8px 20px rgba(0,0,0,.5); animation:ban 3.6s ease forwards}
@keyframes ban{0%{opacity:0; transform:translateY(-14px) scale(.9)} 8%{opacity:1; transform:none} 88%{opacity:1} 100%{opacity:0; transform:translateY(-8px)}}

#toast{position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px); left:50%; translate:-50% 0; width:max-content; max-width:min(92vw,520px); z-index:30; background:#7a1219; color:#fff; border:3px solid #fff; border-radius:16px; padding:10px 18px; font-weight:600; text-align:center; box-shadow:0 10px 26px rgba(0,0,0,.55)}
#over{position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:16px; background:rgba(20,10,4,.74); backdrop-filter:blur(3px)}
#over .card{width:min(92vw,420px); padding:26px 22px; max-height:94vh; overflow:auto}
#over h2{margin:0; font-size:1.7rem; font-weight:700}
#over .big{width:64px; height:64px; font-size:2rem; --cell:68px}
#podium{display:flex; flex-direction:column; gap:8px; width:100%}
#podium .pl{font-size:1.05rem; border-radius:14px; padding:8px 14px}
#podium .pl .tk{width:20px; height:20px}
#podium .me{border-color:#6a3fa3; background:rgba(106,63,163,.14)}
#over .row{flex-direction:column; width:100%}
#over button{width:100%}

@media (max-width:520px){ h1{font-size:2.1rem} main{padding:12px 6px 28px} #board{padding:4px; border-width:4px} #chips button{min-width:96px} .tray{--cell:22px; padding:3px 8px} .tn{max-width:60px} }
@media (prefers-reduced-motion:reduce){ .tk.can,.die.tumble,#clock.low{animation:none} .fl,.fb{animation-duration:.01s;animation-delay:2.6s} *{transition:none!important} }
</style>
</head>
<body>
<main>
  <header><h1 aria-label="Poliana"><span>P</span><span>o</span><span>l</span><span>i</span><span>a</span><span>n</span><span>a</span></h1><div id="code" hidden></div></header>

  <section id="home" class="card">
    <input id="name" maxlength="14" placeholder="Tu nombre" autocomplete="off">
    <button class="main" id="create">Crear sala</button>
    <small>o entra con el código de un amigo</small>
    <div class="row"><input id="jcode" maxlength="4" placeholder="Código" autocomplete="off" style="width:110px;text-transform:uppercase"><button id="join">Unirme</button></div>
    <div id="err"></div>
  </section>

  <section id="lobby" class="card" hidden>
    <small>Pásale este link a tus amigos (2 a 4 jugadores)</small>
    <button id="copy">Copiar link</button>
    <div id="lplayers"></div>
    <button class="main" id="start">Empezar partida</button>
    <small id="wait"></small>
  </section>

  <section id="game" hidden>
    <div id="bw">
      <div class="trays"><div class="tray" id="t0"></div><div class="tray" id="t3"></div></div>
      <div id="board" role="group" aria-label="Tablero de Poliana"></div>
      <div class="trays"><div class="tray" id="t1"></div><div class="tray" id="t2"></div></div>
    </div>
    <div id="clock" role="timer" aria-label="Tiempo del turno">⏱ 1:00</div>
    <div id="msg" aria-live="polite"></div>
    <div class="row" id="chips"></div>
    <div id="hint"></div>
    <div class="row"><button class="main" id="roll">Tirar dados</button></div>
    <div id="players"></div>
    <div id="spec" class="card spec" hidden>
      <b>Eres espectador 👀</b>
      <small id="specSub"></small>
      <div class="row" id="emo"></div>
      <div class="row" id="quick"></div>
      <form id="sayf" class="row"><input id="say" maxlength="40" placeholder="Escribe un mensaje de apoyo" autocomplete="off"><button type="submit">Enviar</button></form>
    </div>
  </section>
</main>

<div id="toast" role="alert" hidden></div>
<div id="fx" aria-hidden="true"></div>
<div id="fxb" aria-live="polite"></div>

<div id="over" role="dialog" aria-modal="true" aria-labelledby="overTitle" hidden>
  <div class="card">
    <b class="tk big" id="overTk">★</b>
    <h2 id="overTitle"></h2>
    <small id="overSub">Tabla de posiciones</small>
    <div id="podium" role="list"></div>
    <div class="row">
      <button class="main" id="again">Jugar otra partida</button>
      <button id="menu">Salir al menú principal</button>
    </div>
  </div>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const COL = [['Verde','#1f9d3a','#fff'],['Amarillo','#f2b705','#3b2800'],['Azul','#1f67dd','#fff'],['Rojo','#d6212c','#fff']];
  const END = 58, RING = 51;
  const MED = ['🥇','🥈','🥉','4°'];
  const EMOJIS = ['🔥','👏','😂','😱','🏆','💀'];
  const QUICK = ['¡Tú puedes!','¡Vamos, remonta!','¡Qué suerte!','¡Mátalo!','¡Buena jugada!'];
  const xy = i => { const s = Math.floor(i / 14), k = i % 14; return s === 0 ? [0,k] : s === 1 ? [k,14] : s === 2 ? [14,14-k] : [14-k,0]; };
  const label = k => k === 0 ? 9 : k <= 5 ? k + 9 : k - 5;
  const mk = (cls, html) => { const d = document.createElement('div'); d.className = cls; if (html) d.innerHTML = html; return d; };

  const board = $('board');
  for (let i = 0; i < 56; i++) {
    const [x, y] = xy(i), k = i % 14, s = Math.floor(i / 14);
    const d = mk('cell' + (k === 0 || k === 8 ? ' col' : '') + (k >= 6 ? ' zone' : ''), '<i>' + label(k) + '</i><div class="toks"></div>');
    d.id = 'r' + i; d.style.gridColumn = x + 1; d.style.gridRow = y + 1; d.style.setProperty('--c', COL[s][1]); board.appendChild(d);
  }
  const PATH = [[0,0],[1,0],[1,1],[2,1],[2,2],[3,2],[3,3]];
  for (let ci = 0; ci < 4; ci++) {
    const gx0 = ci < 2 ? 1 : 9, gy0 = (ci === 0 || ci === 3) ? 1 : 9;
    const q = mk('quad q' + ci, '<span class="qname" id="qn' + ci + '">' + COL[ci][0] + '</span>'); q.id = 'q' + ci;
    q.style.gridColumn = (gx0 + 1) + ' / span 5'; q.style.gridRow = (gy0 + 1) + ' / span 5'; q.style.setProperty('--c', COL[ci][1]); board.appendChild(q);
    PATH.forEach(([x, y], n) => {
      const gx = ci < 2 ? 1 + x : 13 - x, gy = (ci === 0 || ci === 3) ? 1 + y : 13 - y;
      const h = mk('step cell-h' + (n === 6 ? ' goal' : ''), '<i>' + (n + 1) + '</i><div class="toks"></div>');
      h.id = 'h' + ci + '_' + (n + 1); h.style.gridColumn = gx + 1; h.style.gridRow = gy + 1; h.style.setProperty('--c', COL[ci][1]); board.appendChild(h);
    });
  }
  const AP = (s, d, a) => s === 0 ? [d, a + 1] : s === 1 ? [a + 1, 5 - d] : s === 2 ? [5 - d, 3 - a] : [3 - a, d];
  const ARM = [['2 / span 4','7 / span 3'],['7 / span 3','11 / span 4'],['11 / span 4','7 / span 3'],['7 / span 3','2 / span 4']];
  const BASE = [['2 / span 2','2'],['2','2 / span 2'],['2 / span 2','2'],['2','2 / span 2']];
  for (let s = 0; s < 4; s++) {
    const arm = mk('arm ' + (s % 2 === 0 ? 'h' : 'v')); arm.style.gridColumn = ARM[s][0]; arm.style.gridRow = ARM[s][1]; arm.style.setProperty('--c', COL[s][1]); board.appendChild(arm);
    const put = (d, a, txt, n) => {
      const [c, r] = AP(s, d, a), u = mk('uc', txt === '' ? '' : String(txt));
      u.style.gridColumn = c; u.style.gridRow = r;
      if (n) {
        // Mapeo visual exacto: la celda 1 de la casa conecta con la casilla 14 normal, y la celda 7 sale a la casilla 4 normal
        u.id = 'u' + s + '_' + n; u.insertAdjacentHTML('beforeend', '<i>' + n + '</i><div class="toks"></div>');
      }
      arm.appendChild(u);
    };
    for (let d = 1; d <= 4; d++) put(d, 0, d, d);
    for (let d = 4; d >= 2; d--) put(d, 2, 9 - d, 9 - d);
    put(4, 1, '');
    const [zc, zr] = AP(s, 1, 1), z = mk('seed', '<div class="toks"></div>');
    z.id = 'z' + s; z.style.gridColumn = zc; z.style.gridRow = zr; z.setAttribute('aria-label', 'Casilla 0, de siembra'); arm.appendChild(z);
    const base = mk('base'); base.style.gridColumn = BASE[s][0]; base.style.gridRow = BASE[s][1];
    for (let i = 0; i < 4; i++) { const sl = mk('slot', '<div class="toks"></div>'); sl.id = 's' + s + '_' + i; base.appendChild(sl); }
    arm.appendChild(base);
  }
  const bowl = mk('', '<div class="pit"><div class="die" id="d0"></div><div class="die" id="d1"></div></div>'); bowl.id = 'bowl'; board.appendChild(bowl);

  for (let ci = 0; ci < 4; ci++) {
    const t = $('t' + ci); t.style.setProperty('--c', COL[ci][1]);
    t.innerHTML = '<span class="tn" id="tn' + ci + '">' + COL[ci][0] + '</span>' + [0,1,2,3].map(i => '<div class="tslot" id="ts' + ci + '_' + i + '"></div>').join('');
  }

  const ringIdx = (ci, st) => (ci * 14 + 5 + st) % 56;
  const where = (ci, st, i, inH) => {
    if (st < 0) return $('s' + ci + '_' + i);
    if (st >= END) return $('ts' + ci + '_' + i);
    if (st === 0) return $('z' + ci);
    if (inH) { const x = ringIdx(ci, st); return $('u' + Math.floor(x / 14) + '_' + (x % 14 - 5)); }
    return st <= RING ? $('r' + ringIdx(ci, st)) : $('h' + ci + '_' + (st - RING));
  };
  const token = (ci, i) => { const t = document.createElement('b'); t.className = 'tk'; t.textContent = i + 1; t.style.setProperty('--tc', COL[ci][1]); t.style.setProperty('--fg', COL[ci][2]); return t; };
  const dot = ci => { const t = document.createElement('b'); t.className = 'tk'; t.style.setProperty('--tc', COL[ci][1]); return t; };
  const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
  const face = (el, v) => { el.innerHTML = v ? Array.from({length:9}, (_, k) => '<span' + (PIPS[v].includes(k) ? ' class="pip"' : '') + '></span>').join('') : ''; el.setAttribute('aria-label', v ? 'Dado: ' + v : 'Dado sin tirar'); };

  EMOJIS.forEach(e => { const b = document.createElement('button'); b.type = 'button'; b.textContent = e; b.setAttribute('aria-label', 'Reaccionar ' + e); b.onclick = () => send({t:'react', v:e}); $('emo').appendChild(b); });
  QUICK.forEach(m => { const b = document.createElement('button'); b.type = 'button'; b.textContent = m; b.onclick = () => send({t:'say', v:m}); $('quick').appendChild(b); });
  $('sayf').onsubmit = e => { e.preventDefault(); const v = $('say').value.trim(); if (v) { send({t:'say', v}); $('say').value = ''; } };

  function showFx(m){
    if (m.kind === 'emoji') {
      const fx = $('fx'); while (fx.children.length > 24) fx.firstChild.remove();
      const d = mk('fl', '<span class="fe"></span><small class="fn"></small>');
      d.style.left = (10 + Math.random() * 80) + '%';
      d.firstChild.textContent = m.v; d.lastChild.textContent = m.name; fx.appendChild(d); setTimeout(() => d.remove(), 3000);
    } else {
      const box = $('fxb'), b = mk('fb'); b.textContent = m.name + ': ' + m.v; box.appendChild(b);
      while (box.children.length > 3) box.firstChild.remove();
      setTimeout(() => b.remove(), 3700);
    }
  }

  let ws, S = null, sess = null, selKey = null, pend = null, lastN = null, toastT = null, overShown = false;
  let rolling = false, rollT = null, endAt = 0, rejoin = false;
  try { sess = JSON.parse(sessionStorage.getItem('poliana') || 'null'); } catch (e) {}
  const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  function connect(first){
    const sock = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host); ws = sock;
    sock.onopen = () => { if (first) first(); else if (sess) { rejoin = true; send({t:'join', code:sess.code, id:sess.id, name:sess.name}); } };
    sock.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.t === 'error') {
        if (rejoin || !S) {
          $('err').textContent = m.text;
          if (rejoin) { rejoin = false; sess = null; try { sessionStorage.removeItem('poliana'); } catch (x) {} S = null; endAt = 0; show(); }
        } else toast(m.text);
      }
      else if (m.t === 'state') onState(m);
      else if (m.t === 'fx') showFx(m);
    };
    sock.onclose = () => { if (sess && ws === sock) setTimeout(() => connect(), 1500); };
  }
  const open = cb => (ws && ws.readyState === 1) ? cb() : connect(cb);
  const nm = () => $('name').value.trim() || 'Jugador';

  $('create').onclick = () => { $('err').textContent = ''; open(() => send({t:'create', name:nm()})); };
  $('join').onclick = () => {
    const c = $('jcode').value.trim(); if (!c) { $('err').textContent = 'Escribe el código de la sala'; return; }
    $('err').textContent = ''; open(() => send({t:'join', code:c, name:nm()}));
  };
  $('start').onclick = () => send({t:'start'});
  $('again').onclick = () => send({t:'start'});
  $('roll').onclick = () => send({t:'roll'});
  $('menu').onclick = () => {
    try { sessionStorage.removeItem('poliana'); } catch (e) {}
    clearInterval(rollT); rolling = false;
    const old = ws; sess = null; S = null; selKey = null; pend = null; lastN = null; overShown = false; ws = null; endAt = 0; rejoin = false;
    if (old) { try { old.close(); } catch (e) {} }
    $('err').textContent = ''; $('copy').textContent = 'Copiar link'; show();
  };
  $('copy').onclick = async () => {
    const link = location.origin + location.pathname + '?sala=' + S.code;
    try { await navigator.clipboard.writeText(link); $('copy').textContent = 'Link copiado'; } catch (e) { $('copy').textContent = link; }
  };
  const q = new URLSearchParams(location.search).get('sala'); if (q) $('jcode').value = q.toUpperCase();

  function toast(text){
    const t = $('toast'); t.textContent = text; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 5200);
  }

  function tick(){
    const c = $('clock');
    if (!S || !endAt) { c.style.visibility = 'hidden'; return; }
    const sec = Math.ceil(Math.max(0, endAt - Date.now()) / 1000);
    c.textContent = '⏱ ' + Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    c.classList.toggle('low', sec <= 10); c.style.visibility = 'visible';
  }
  setInterval(tick, 250);

  function startRoll(){
    clearInterval(rollT); rolling = true;
    const ds = [$('d0'), $('d1')];
    ds.forEach((d, k) => { d.classList.remove('tumble', 'used'); d.style.animationDelay = (k * 70) + 'ms'; void d.offsetWidth; d.classList.add('tumble'); });
    const t0 = Date.now();
    rollT = setInterval(() => {
      if (Date.now() - t0 >= 720) {
        clearInterval(rollT); rolling = false; ds.forEach(d => d.classList.remove('tumble'));
        if (S) render();
        return;
      }
      ds.forEach(d => face(d, 1 + Math.floor(Math.random() * 6)));
    }, 70);
  }

  function onState(m){
    const prev = S; S = m; pend = null; rejoin = false;
    endAt = m.left > 0 ? Date.now() + m.left : 0;
    if (!sess || sess.code !== m.code || sess.id !== m.id) {
      sess = {code:m.code, id:m.id, name:m.players[m.you].name};
      try { sessionStorage.setItem('poliana', JSON.stringify(sess)); } catch (e) {}
    }
    if (m.notice) {
      if (lastN === null) lastN = m.notice.n;
      else if (m.notice.n !== lastN) { lastN = m.notice.n; if (m.notice.text) toast(m.notice.text); }
    }
    if (m.cur === m.you && m.phase === 'move') {
      const av = m.legal.amts.filter(a => a.pieces.length);
      if (!av.some(a => a.key === selKey)) selKey = (av.length === 1 && !m.legal.enter) ? av[0].key : null;
    } else selKey = null;
    if (prev && m.dice[0] && (prev.dice.join() !== m.dice.join() || (prev.phase === 'roll' && m.phase !== 'roll'))) startRoll();
    show(); render(); tick();
  }
  function show(){
    const lobby = S && S.phase === 'lobby', game = S && !lobby;
    $('home').hidden = !!S; $('lobby').hidden = !lobby; $('game').hidden = !game;
    $('code').hidden = !S; if (S) $('code').textContent = 'Sala ' + S.code;
    const over = !!S && S.phase === 'over';
    $('over').hidden = !over;
    if (over && !overShown) { overShown = true; setTimeout(() => $('again').focus(), 50); }
    if (!over) overShown = false;
    if (!S) { $('toast').hidden = true; $('copy').textContent = 'Copiar link'; tick(); }
  }
  function can(i){
    const s = S; if (s.cur !== s.you || s.phase !== 'move' || rolling) return false;
    const st = s.players[s.you].steps[i];
    if (st < 0) return !!s.legal.enter;
    if (st >= END || !selKey) return false;
    const a = s.legal.amts.find(x => x.key === selKey); return !!a && a.pieces.some(p => p.i === i);
  }
  const hasKill = rt => Object.values(rt).some(v => v > 0);
  function pick(i){
    const st = S.players[S.you].steps[i];
    if (st < 0) { send({t:'move', i, key:'e'}); return; }
    const a = S.legal.amts.find(x => x.key === selKey), pc = a && a.pieces.find(p => p.i === i); if (!pc) return;
    const ks = Object.keys(pc.rt);
    if (ks.length === 1) send({t:'move', i, key:selKey, route:ks[0]});
    else { pend = i; render(); }
  }
  function hintText(s, mine, me){
    if (me.spec && s.phase !== 'over') return '';
    if (!mine) return '';
    if (s.phase === 'roll') return 'Tu turno: toca “Tirar dados”';
    if (s.phase !== 'move' || rolling) return '';
    const L = s.legal, canMove = L.amts.some(a => a.pieces.length);
    if (pend !== null) return 'Elige por dónde va la ficha: carril normal (se puede matar) o casa (segura, sin saltar fichas)';
    if (L.bonus) return '¡Bono de +10!: toca la ficha que quieres avanzar 10 casillas';
    if (L.enter && !canMove) return L.enter.n === 2 ? '¡Doble seis! Toca una ficha de tu celda para sembrar 2 a la vez' : 'Toca una ficha de tu celda para sembrarla';
    if (canMove && L.amts.some(a => a.pieces.some(p => Object.keys(p.rt).length > 1))) return 'Elige un dado y toca la ficha; si puede entrar a una casa, te dejo elegir el camino';
    return 'Elige un dado y toca la ficha que quieres mover';
  }

  function render(){
    const s = S, mine = s.cur === s.you, me = s.players[s.you], spec = !!me.spec;
    if (s.phase === 'lobby') {
      $('lplayers').innerHTML = '';
      s.players.forEach((p, k) => { const d = mk('pl'); d.appendChild(dot(k)); d.append(p.name + (k === s.you ? ' (tú)' : '')); $('lplayers').appendChild(d); });
      const host = s.you === 0;
      $('start').hidden = !host; $('start').disabled = s.players.length < 2;
      $('wait').textContent = host ? (s.players.length < 2 ? 'Esperando a que se una al menos un amigo' : 'Cuando estén todos, dale a empezar') : 'Esperando a que el anfitrión empiece';
      return;
    }
    document.querySelectorAll('.toks,.tslot').forEach(e => e.innerHTML = '');
    const sel = (mine && s.phase === 'move' && selKey) ? s.legal.amts.find(a => a.key === selKey) : null;
    s.players.forEach((p, pi) => p.steps.forEach((st, i) => {
      const t = token(p.ci, i); if (st === END) t.classList.add('done');
      if (pi === s.you && can(i)) {
        t.classList.add('can');
        const pc = sel && sel.pieces.find(x => x.i === i);
        if ((st < 0 && s.legal.enter && s.legal.enter.kills > 0) || (pc && hasKill(pc.rt))) t.classList.add('hit');
        if (pend === i) t.classList.add('pick');
        t.tabIndex = 0; t.setAttribute('role', 'button'); t.setAttribute('aria-label', 'Mover ficha ' + (i + 1));
        t.onclick = () => pick(i);
        t.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(i); } };
      }
      const el = where(p.ci, st, i, p.inH[i]); (el.querySelector('.toks') || el).appendChild(t);
    }));
    const byCi = {}; s.players.forEach(p => { byCi[p.ci] = p; });
    for (let ci = 0; ci < 4; ci++) {
      $('q' + ci).classList.toggle('empty', !byCi[ci]);
      $('q' + ci).classList.toggle('act', !!byCi[ci] && s.phase !== 'over' && s.players[s.cur].ci === ci);
      $('qn' + ci).textContent = byCi[ci] ? byCi[ci].name : COL[ci][0];
      $('tn' + ci).textContent = byCi[ci] ? byCi[ci].name : COL[ci][0];
      $('t' + ci).classList.toggle('empty', !byCi[ci]);
    }
    $('players').innerHTML = '';
    s.players.forEach((p, pi) => {
      const d = mk('pl' + (pi === s.cur && s.phase !== 'over' && !p.spec ? ' cur' : '') + (p.spec ? ' spec' : ''));
      d.appendChild(dot(p.ci));
      d.append(p.name + (pi === s.you ? ' (tú)' : '') + ' · ' + p.steps.filter(x => x === END).length + '/4 libres' + (p.place ? ' · ' + p.place + '° lugar' : '') + (p.on ? '' : ' · desconectado'));
      $('players').appendChild(d);
    });
    if (!rolling) {
      face($('d0'), s.dice[0]); face($('d1'), s.dice[1]);
      $('d0').classList.toggle('used', s.used[0]); $('d1').classList.toggle('used', s.used[1]);
    }
    $('msg').textContent = rolling ? 'Tirando los dados…' : s.msg;
    $('hint').textContent = hintText(s, mine, me);
    $('roll').hidden = s.phase === 'over' || spec; $('roll').classList.toggle('idle', !(mine && s.phase === 'roll'));

    const chips = $('chips'); chips.innerHTML = '';
    if (mine && s.phase === 'move' && !rolling) {
      const a = s.legal.amts.find(x => x.key === selKey), pc = (pend !== null && a) ? a.pieces.find(p => p.i === pend) : null;
      if (pc && Object.keys(pc.rt).length > 1) {
        [['n','Carril normal'],['h','Casa (puente)']].forEach(([k, txt]) => {
          if (pc.rt[k] === undefined) return;
          const b = document.createElement('button');
          b.textContent = txt + (pc.rt[k] > 0 ? ' · mata' : ''); if (pc.rt[k] > 0) b.classList.add('kill');
          b.onclick = () => { const i = pend; pend = null; send({t:'move', i, key:selKey, route:k}); };
          chips.appendChild(b);
        });
        const c = document.createElement('button'); c.textContent = 'Cancelar'; c.onclick = () => { pend = null; render(); }; chips.appendChild(c);
      } else {
        s.legal.amts.forEach(a => {
          const kills = a.pieces.some(p => hasKill(p.rt));
          const b = document.createElement('button');
          b.textContent = (a.bonus ? 'Bono +' + a.val : a.sum ? 'Suma ' + a.val : 'Dado ' + a.val) + (kills ? ' · mata' : '');
          b.disabled = !a.pieces.length; if (a.key === selKey) b.classList.add('on'); if (kills) b.classList.add('kill');
          b.onclick = () => { selKey = a.key; pend = null; render(); }; chips.appendChild(b);
        });
      }
    }

    $('spec').hidden = !(spec && s.phase !== 'over');
    if (spec) $('specSub').textContent = 'Quedaste en ' + me.place + '° lugar. Anima a los demás mientras terminan.';

    if (s.phase === 'over') {
      const w = s.players.find(p => p.place === 1) || s.players[s.cur];
      $('overTitle').textContent = '¡' + w.name + ' ganó!';
      const t = $('overTk'); t.style.setProperty('--tc', COL[w.ci][1]); t.style.setProperty('--fg', COL[w.ci][2]);
      $('overSub').textContent = 'Tabla de posiciones';
      const pod = $('podium'); pod.innerHTML = '';
      s.players.map((p, i) => ({p, i})).sort((a, b) => (a.p.place || 9) - (b.p.place || 9)).forEach(({p, i}) => {
        const li = mk('pl' + (i === s.you ? ' me' : '')); li.setAttribute('role', 'listitem');
        li.appendChild(dot(p.ci)); li.append((MED[p.place - 1] || p.place + '°') + ' ' + p.name + (i === s.you ? ' (tú)' : '') + ' · ' + p.steps.filter(x => x === END).length + '/4 libres');
        pod.appendChild(li);
      });
      $('again').disabled = false;
      $('again').textContent = 'Jugar otra partida';
    }
  }

  show(); tick();
  if (sess) connect();
})();
</script>
</body>
</html>
